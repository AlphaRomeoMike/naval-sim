<style>
:root { --bg:#0b1c2c; --panel:#10283c; --line:#234560; --text:#dbe8f2; --dim:#8ea6b8; --own:#6fd3ff; --foe:#ff7a66; --ok:#7bd88f; --warn:#ffd166; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; overscroll-behavior:none; }
canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
#map:focus-visible { outline:2px solid var(--own); outline-offset:-2px; }
button, select { font:inherit; color:var(--text); background:#17364f; border:1px solid var(--line); border-radius:6px; padding:6px 10px; min-height:34px; cursor:pointer; }
button:hover:not(:disabled) { background:#1f4666; }
button:disabled { opacity:.45; cursor:default; }
button:focus-visible, select:focus-visible, a:focus-visible { outline:2px solid var(--warn); outline-offset:1px; }
button.on { background:#2a6a8f; border-color:var(--own); }
a { color:var(--own); }
#bar { position:fixed; top:0; left:0; right:0; display:flex; gap:8px; align-items:center; padding:6px 8px; padding-top:max(6px, env(safe-area-inset-top)); background:rgba(11,28,44,.88); border-bottom:1px solid var(--line); flex-wrap:wrap; }
#scnName { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34vw; }
#clock { color:var(--dim); font-variant-numeric:tabular-nums; margin-right:auto; }
#speed { display:flex; gap:2px; }
#speed button { padding:6px 7px; min-width:34px; }
#panel { position:fixed; top:54px; right:8px; width:300px; max-height:calc(100% - 62px); overflow:auto; background:rgba(16,40,60,.94); border:1px solid var(--line); border-radius:8px; padding:10px; }
#panel h2 { margin:0 0 2px; font-size:16px; }
#panel h3 { margin:12px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
#panel .row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
#panel .kv { color:var(--dim); font-size:12.5px; }
#panel .kv b { color:var(--text); font-weight:500; }
#panel .bad { color:var(--foe); }
#panel .w { display:flex; gap:6px; align-items:center; justify-content:space-between; padding:3px 0; border-top:1px solid rgba(255,255,255,.06); }
#panel .w small { color:var(--dim); display:block; }
#panel [data-ring]:hover { background:rgba(255,255,255,.06); }
.hpbar { height:6px; background:#0a1622; border-radius:3px; overflow:hidden; margin:4px 0; }
.hpbar i { display:block; height:100%; background:var(--ok); }
#log { position:fixed; left:8px; bottom:34px; margin:0; padding:0; list-style:none; max-width:min(420px, 70vw); font-size:12.5px; color:var(--dim); pointer-events:none; text-shadow:0 1px 2px #000; }
#log li.foe { color:var(--foe); } #log li.own { color:var(--own); } #log li.warn { color:var(--warn); }
#hud { position:fixed; left:50%; transform:translateX(-50%); bottom:6px; width:max-content; max-width:calc(100vw - 680px); font-size:12px; color:var(--dim); pointer-events:none; text-align:center; text-shadow:0 1px 2px #000; }
#hint { position:fixed; left:50%; top:60px; transform:translateX(-50%); background:rgba(16,40,60,.95); border:1px solid var(--warn); border-radius:8px; padding:8px 12px; max-width:min(520px, 92vw); }
#hint[hidden], #panel[hidden], #ctx[hidden] { display:none; }
#ctx { position:fixed; min-width:200px; display:grid; gap:3px; background:rgba(16,40,60,.97); border:1px solid var(--line); border-radius:8px; padding:6px; box-shadow:0 6px 20px rgba(0,0,0,.45); }
#ctx b { padding:2px 4px; } #ctx small { color:var(--dim); padding:0 4px; }
#ctx h3 { margin:6px 4px 1px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
#ctx button { text-align:left; min-height:30px; padding:4px 10px; }
dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:16px; width:min(560px, 94vw); max-height:90vh; overflow:auto; }
dialog::backdrop { background:rgba(3,10,18,.7); }
dialog h1 { font-size:20px; margin:0 0 8px; } dialog h2 { font-size:15px; margin:14px 0 6px; }
dialog p { margin:6px 0; } dialog .list { display:grid; gap:6px; }
dialog .list button { text-align:left; }
dialog .list small { display:block; color:var(--dim); }
dialog .foot { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; flex-wrap:wrap; }
dialog input[type=text] { font:inherit; width:100%; padding:8px; border-radius:6px; border:1px solid var(--line); background:#0a1a28; color:var(--text); }
kbd { background:#0a1a28; border:1px solid var(--line); border-radius:4px; padding:0 5px; font:12px ui-monospace, monospace; }
table.keys { border-collapse:collapse; width:100%; } table.keys td { padding:3px 6px; border-top:1px solid rgba(255,255,255,.06); vertical-align:top; }
@media (max-width: 1000px) { #hud { display:none; } }
@media (max-width: 720px) {
  #panel { top:auto; bottom:0; left:0; right:0; width:auto; max-height:44%; border-radius:10px 10px 0 0; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
  #log { bottom:auto; top:96px; }
  #scnName { display:none; }
}

<noscript><div style="max-width:40em;margin:3em auto;padding:0 16px">
<h1>Flag Plot</h1>
<p>A free Cold War naval tactics game for the browser. Command frigates, submarines and aircraft on a 2D tactical plot, US Navy against the Soviet Navy, 1970 to 1990: radar and sonar, missiles, torpedoes, sonobuoys and an enemy that hunts back. It has a ten-minute tutorial and three scenarios, plays with mouse, touch or keyboard alone, and works offline once loaded.</p>
<p>The game needs JavaScript to run. Please turn it on and reload.</p>
</div></noscript>
